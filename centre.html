<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Classement Centre</title>
    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #2b2b2b;
    font-family: 'Arial', sans-serif;
    padding: 40px 20px;
    min-height: 100vh;
    font-size: 16px; /* base ajoutée */
}

.container {
    width:100%;
    max-width: 1400px; 
    margin: 0 auto;
}
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.header {
    text-align: center;
    margin-bottom: 40px;
    color: white;
}

.header h1 {
    font-size: 4em;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

/* ===== AJOUT : Media queries pour mobile ===== */

/* Tablettes */
@media (max-width: 768px) {
    body {
        padding: 20px 15px; /* réduit le padding */
    }
    
    .header {
        margin-bottom: 25px;
    }
    
    .header h1 {
        font-size: 1.8em; /* réduit la taille */
        letter-spacing: 1px;
    }
}

/* Smartphones */
@media (max-width: 480px) {
    body {
        padding: 15px 10px;
    }
    
    .header h1 {
        font-size: 1.4em; /* encore plus petit */
        letter-spacing: 0.5px;
    }
}
        
        .flag {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #3a3a3a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        
        thead {
            background: #e74c3c;
            color: white;
        }
        
        th {
            padding: 18px;
            height: 60px;
            text-align: left;
            font-weight: bold;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        th:last-child {
            border-right: none;
        }
        
        td {
            padding: 16px 18px;
            Height: 50px;
            border-bottom: 1px solid #4a4a4a;
            color: #e0e0e0;
        }
        
        tbody tr:last-child td {
            border-bottom: none;
        }
        
        tbody tr:hover {
            background-color: #454545;
            transition: background-color 0.3s ease;
        }

        .pos {
            font-weight: bold;
            color: #e74c3c;
        }
               
        .centre {
            background-color: #1a1a1a;
            color: #4db8ff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
                
        .points {
            text-align: center;
            font-weight: 600;
            color: #4db8ff;
        }
        
        .total {
            background-color: #e07856;
            color: white;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 4px;
            text-align: center;
        }
        /* Navigation commune entre les pages */
        .nav-menu {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 24px;
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: nowrap;
            overflow-x: auto;
            background-color: #2a2a2a;
            border-bottom: 3px solid #e74c3c;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.35);
        }

        .nav-menu a {
            color: #fff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background-color: #e74c3c;
            color: #fff;
        }

        .sous-menu {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 24px;
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: nowrap;
            overflow-x: auto;
            background-color: #2a2a2a;
            border-bottom: 3px solid #e74c3c;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.35);
        }
         .sous-menu a {
            color: #fff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .sous-menu a:hover,
        .sous-menu a.active {
            background-color: #e74c3c;
            color: #fff;
        }
        
    </style>
</head>
